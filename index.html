<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나노입자실험_글쓰기_피드백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for one teacher and two expert reviewers
   IDEA a marking desk: the student's ruled manuscript sheet with three coloured pens beside it
   PICTURE the open manuscript and three pen-coloured feedback cards, live from the shared store
   COLOUR white ground, near-black ink; blue, red, amber pens for AI / expert 1 / expert 2
   TYPE IBM Plex Sans KR for the desk, Noto Serif KR for the student's own writing
   LAYOUT roster column left, sheet over pens right; at 860px the roster becomes a chip row; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14161b);--ink:light-dark(#16171b,#ecebe7);--mute:light-dark(#5f626a,#a2a5ad);--line:light-dark(#e4e2dd,#2d3038);--side:light-dark(#f5f4f1,#1a1d23);--rule:light-dark(#ebe5d8,#292c33);--ai:light-dark(#1f5bd1,#86acff);--e1:light-dark(#c3263a,#ff8593);--e2:light-dark(#a35a00,#f0aa52)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding:24px max(4vw,16px) 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.02em;font-weight:700}
.q{margin:6px 0 0;color:var(--mute);max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.ghost.danger{color:var(--e1)}
.btn.red{background:var(--e1);border-color:var(--e1);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,.stu:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:7px;background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.note{margin:0;padding:10px max(4vw,16px);background:var(--side);border-bottom:1px solid var(--line);font-size:14px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr)}
.roster{background:var(--side);border-right:1px solid var(--line);padding:16px 12px}
.rh{display:flex;justify-content:space-between;gap:8px;padding:0 8px 10px;font-size:13px;color:var(--mute)}
#list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.stu{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.stu:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.stu.on{background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:5px;flex:none}
.d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c,var(--mute))}
.d.f{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.ws{padding:22px max(3vw,16px) 48px}
.wsh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{margin:0;font-size:24px;letter-spacing:-.01em}
.wsa{display:flex;gap:8px;flex-wrap:wrap}
.sheet{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px}
.meta{font-size:13px;color:var(--mute)}
.essay{display:block;width:100%;min-height:18em;resize:vertical;border:0;padding:0 2px;background:transparent repeating-linear-gradient(to bottom,transparent 0 calc(2em - 1px),var(--rule) calc(2em - 1px) 2em);background-attachment:local;font:17px/2em "Noto Serif KR",Batang,serif}
.essay:focus{outline:none}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.diff{font:16px/1.9 "Noto Serif KR",serif}
.diff ins{background:color-mix(in srgb,var(--ai) 20%,transparent);text-decoration:none;border-radius:3px}
.diff del{color:var(--e1);opacity:.8}
.pens{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pen{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pen h3{margin:0;font-size:16px;color:var(--pen);display:flex;align-items:center;gap:8px}
.pen h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pen);flex:none}
.pen textarea{flex:1;min-height:17em;width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px;line-height:1.65}
.pen textarea:focus{border-color:var(--pen);outline:none}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.empty{max-width:46ch;padding:40px 0;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.dlg{background:var(--bg);border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.dlg h3{margin:0;font-size:20px}
.dlg label{display:grid;gap:6px;font-weight:600;font-size:14px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;font-weight:400}
.dlg textarea{min-height:6em;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.roster{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}#list{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}#list li{flex:none}.stu{width:auto}}
@media(max-width:600px){.top{align-items:flex-start}.acts{width:100%}.acts .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:no-preference){.pen textarea.busy{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{border-color:var(--pen)}}}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.go{border-color:var(--ai);color:var(--ai)}
.tag.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stu .sub{display:block;font-size:12px;color:var(--mute)}
.solo{max-width:780px;margin:0 auto;padding:24px 16px 64px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 20px;padding:0;counter-reset:st}
.steps li{counter-increment:st;font-size:14px;color:var(--mute);padding:6px 12px 6px 8px;border-radius:99px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.steps li::before{content:counter(st);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--side)}
.steps li.now{color:var(--ink);border-color:var(--ink);font-weight:600}
.steps li.now::before{background:var(--ink);color:var(--bg)}
.steps li.ok::before{content:"✓";background:var(--ai);color:#fff}
.wait{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--mute);margin:0 0 18px}
.wait b{display:block;color:var(--ink);margin-bottom:4px}
.fbc{border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:12px;padding:12px 16px;white-space:pre-wrap;line-height:1.7}
.fbc b{display:block;color:var(--pen);margin-bottom:4px;white-space:normal}
.fbs{display:grid;gap:12px;margin-bottom:22px}
.read{white-space:pre-wrap;font:17px/2em "Noto Serif KR",Batang,serif;background:repeating-linear-gradient(to bottom,transparent 0 calc(2em - 1px),var(--rule) calc(2em - 1px) 2em);min-height:6em}
.sec{margin:26px 0 10px;font-size:18px}
.draft{opacity:.7}
.read{background-origin:content-box}
.acts[hidden],.ov[hidden]{display:none}
</style>
</head>
<body>
<header class="top">
  <div><h1>나노입자실험_글쓰기_피드백</h1><p class="q" id="q">과제를 불러오는 중이에요.</p></div>
  <div class="acts" id="acts" hidden>
    <div class="seg" id="rounds" aria-label="차수"><button type="button" data-r="1" class="on">1차 글</button><button type="button" data-r="2">2차 수정본</button></div>
    <button type="button" class="btn ghost" id="bulk" hidden>AI 피드백 모두 만들기</button>
    <button type="button" class="btn ghost" id="dlAll">피드백지 모두 받기</button>
    <button type="button" class="btn ghost" id="setB" hidden>과제 설정</button>
  </div>
</header>
<p class="note" id="note" hidden></p>
<main id="main"><div class="solo"><div class="empty"><b>불러오는 중</b>잠시만 기다려 주세요.</div></div></main>
<div class="ov" id="ovSet" hidden><form class="dlg" id="fSet"><h3>과제 설정</h3><label>과제 질문<textarea id="sQ"></textarea></label><label>평가 기준 (AI 피드백에 쓰여요)<textarea id="sC"></textarea></label><label>실험 자료 요약 (AI 피드백에 쓰여요)<textarea id="sX"></textarea></label><div class="two"><label>전문가 1 이름<input id="sE1"></label><label>전문가 2 이름<input id="sE2"></label></div><div class="row"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-close>취소</button></div></form></div>
<div class="ov" id="ovOk" hidden><div class="dlg"><h3 id="okT"></h3><p class="meta" id="okM"></p><div class="row"><button class="btn" type="button" id="okGo"></button><button class="btn ghost" type="button" data-close>취소</button></div></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLOTS=['ai','e1','e2'];
const DEF={
  question:'물질의 색은 물질의 특성인가? 실험 결과를 근거로 자신의 주장을 펼치는 글을 쓰시오.',
  criteria:'주장: 범위나 조건을 붙여 분명하게 썼는가\n근거의 다양성: 자료를 여러 개 쓰고, 같은 물질인데 색이 다른 경우와 다른 물질인데 색이 같은 경우를 모두 다루었는가\n추론: 각 결과가 주장을 어떻게 뒷받침하는지 연결했는가\n과학 개념: 흡수, 산란, 보색을 정확히 썼는가\n반론: 반론을 제시하고 증거로 재반박했는가',
  context:'1. 은거울 반응: 질산은과 암모니아수로 만든 용액에 포도당을 넣자 시험관 벽에 은색 거울이 생김\n2. 은 나노입자 합성: 질산은에 수소화붕소나트륨을 넣자 투명한 노란 용액이 됨 (시간이 지나 뭉치면 색이 변함)\n3. 틴들 현상: 나노입자 용액과 같은 색으로 만든 식용 색소 용액에 레이저를 비추자 나노입자 용액에서만 빛줄기가 보임\n4. 금 나노입자 합성과 UV 측정: 환원제 농도에 따라 붉은색에서 보라색까지 달라지고, 최대 흡수 파장이 약 520nm에서 더 긴 쪽으로 이동함\n5. 리쿠르고스 컵: 4세기 로마 유리잔. 앞에서 빛을 비추면 초록, 뒤에서 비추면 빨강으로 보임',
  e1Name:'전문가 1',e2Name:'전문가 2'
};
/* data
   subs/<uid>   student's own: {label,t1,s1,t2,s2,u1,u2}  (student writes own; teacher/experts read)
   drafts/<uid>_<r>_<slot>  feedback being written: {text,updatedAt,by,src}  (teacher/experts only)
   sent/<uid>   feedback handed to the student: {r1:{ai,e1,e2,at},r2:{...}}  (student reads own) */
const S={cfg:{},subs:new Map(),drafts:new Map(),sent:new Map(),sel:null,round:1,dirty:new Set(),busy:new Set(),me:null,admin:false,owner:false,names:{},mine:undefined,mySent:null};
let db=null,user=null,sample=null,dl=null,built=null,running=false,stop=false,okFn=null,roW=false;
const timers={},pending={},chain={},asked=new Set();
try{const o=JSON.parse(localStorage.getItem('fbroom2')||'{}');S.sel=o.sel||null;S.round=o.round===2?2:1}catch(e){}
const remember=()=>{try{localStorage.setItem('fbroom2',JSON.stringify({sel:S.sel,round:S.round}))}catch(e){}};
const cfg=k=>typeof S.cfg[k]==='string'&&S.cfg[k].trim()?S.cfg[k]:DEF[k];
const dKey=(sid,r,sl)=>sid+'_'+r+'_'+sl;
const sub=sid=>S.subs.get(sid)||{};
const txt=(sid,r)=>String(sub(sid)['t'+r]||'');
const subm=(sid,r)=>!!sub(sid)['s'+r];
const dft=(sid,r,sl)=>(S.drafts.get(dKey(sid,r,sl))||{}).text||'';
const sentR=(sid,r)=>(S.sent.get(sid)||{})['r'+r]||null;
const penName=sl=>sl==='ai'?'AI 피드백':cfg(sl+'Name');
const note=t=>{const n=$('#note');n.textContent=t||'';n.hidden=!t};
const sorted=()=>[...S.subs.entries()].map(([id,d])=>Object.assign({},d,{id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||String(a.label).localeCompare(String(b.label),'ko'));
const when=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const stat=(k,t)=>{const el=document.getElementById('m-'+k);if(el)el.textContent=t};
const openOv=id=>{const o=$('#'+id);o.hidden=false;const f=o.querySelector('textarea,input,.btn');f&&f.focus()};
const closeOv=()=>document.querySelectorAll('.ov').forEach(o=>o.hidden=true);
const ask=(title,msg,go,fn)=>{$('#okT').textContent=title;$('#okM').textContent=msg;$('#okGo').textContent=go;okFn=fn;openOv('ovOk')};
const errMsg=e=>e&&e.code==='invalid_argument'?'저장 권한이 없어요.':e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'저장하지 못했어요. 잠시 뒤 다시 해 보세요.';
const fbCards=(o,names)=>SLOTS.map(sl=>`<div class="fbc" style="--pen:var(--${sl})"><b>${esc(names[sl])}</b>${esc(o&&o[sl]||'')||'<span class="meta">(이 피드백은 없어요)</span>'}</div>`).join('');

function renderTop(){
  $('#q').textContent=cfg('question');
  document.querySelectorAll('#rounds button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.round));
}
function chain1(path,fn){chain[path]=(chain[path]||Promise.resolve()).then(fn);return chain[path]}
function queue(k,fn){clearTimeout(timers[k]);stat(k,'입력 중…');pending[k]=fn;timers[k]=setTimeout(()=>{const f=pending[k];delete pending[k];if(f)f()},1200)}
function flush(){return Promise.all(Object.keys(pending).map(k=>{clearTimeout(timers[k]);const f=pending[k];delete pending[k];return f()}))}

/* ───────── student ───────── */
function stuStage(){
  const m=S.mine,sn=S.mySent||{};
  if(!m)return 0;
  if(!m.s1)return 1;
  if(!sn.r1)return 2;
  if(!m.s2)return 3;
  if(!sn.r2)return 4;
  return 5;
}
let stuBuilt=null;
function renderStudent(){
  const main=$('#main');
  if(S.mine===undefined)return;
  const st=stuStage();
  const key=st+'|'+(S.mine&&S.mine.label);
  if(key===stuBuilt){fillStudent();return}
  stuBuilt=key;S.dirty.clear();
  const steps=['1차 글 쓰기','피드백 받기','수정본 쓰기','최종 피드백'];
  const on=[0,0,1,2,3,3][st];
  const stepsH=`<ol class="steps">${steps.map((t,i)=>`<li class="${i<on||st===5?'ok':i===on?'now':''}">${t}</li>`).join('')}</ol>`;
  const sn=S.mySent||{},m=S.mine||{};
  const names={ai:penName('ai'),e1:penName('e1'),e2:penName('e2')};
  let h='';
  if(st===0){
    h=`<form id="fJoin" class="sheet"><h2 style="margin-bottom:6px">시작하기</h2><p class="meta" style="margin:0 0 12px">선생님이 알려 준 번호나 가명을 적어 주세요. 실명은 쓰지 않아요.</p><div class="row"><input id="jn" maxlength="40" required style="flex:1 1 200px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)" placeholder="예: 3번"><button class="btn" type="submit">시작</button></div></form>`;
  }else{
    h=`<div class="wsh"><h2>${esc(m.label)}</h2><span class="meta" id="m-w"></span></div>${stepsH}`;
    if(st===1||st===3){
      const r=st===1?1:2;
      if(r===2)h+=`<h3 class="sec">1차 글에 받은 피드백</h3><div class="fbs">${fbCards(sn.r1,names)}</div>`;
      h+=`<div class="sheet"><div class="bar"><b>${r===1?'1차 글':'2차 수정본'}</b><span class="meta" id="cc"></span><span class="meta" id="m-essay"></span></div>
      <textarea class="essay" id="essay" aria-label="${r===1?'1차 글':'2차 수정본'}" placeholder="${r===1?'과제를 읽고 내 주장과 근거를 써 보세요. 쓰는 동안 자동으로 저장돼요.':'피드백을 읽고 1차 글을 고쳐 써 보세요. 자동으로 저장돼요.'}"></textarea>
      ${r===2?'<details><summary>1차 글 다시 보기</summary><div class="read" style="font-size:16px">'+esc(m.t1)+'</div></details>':''}</div>
      <div class="row"><button class="btn" type="button" id="subB">${r===1?'1차 글 제출하기':'수정본 제출하기'}</button><span class="meta">제출하면 더 고칠 수 없어요.</span></div>`;
    }else if(st===2){
      h+=`<div class="wait"><b>1차 글을 제출했어요</b>AI와 전문가 선생님들이 피드백을 쓰고 있어요. 피드백이 오면 이 화면에 바로 나타나요.</div><h3 class="sec">내가 제출한 글</h3><div class="sheet read">${esc(m.t1)}</div>`;
    }else if(st===4){

function diff(a,b){
  const tk=s=>s.replace(/\r/g,'').replace(/\n+/g,' \n ').split(/[ \t]+/).filter(Boolean).slice(0,1500);
  const A=tk(a),B=tk(b),n=A.length,m=B.length,W=m+1,L=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*W+j]=A[i]===B[j]?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  const out=[],put=(t,tag)=>out.push(t==='\n'?'<br>':tag?`<${tag}>${esc(t)}</${tag}>`:esc(t));
  let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){put(A[i]);i++;j++}else if(L[(i+1)*W+j]>=L[i*W+j+1]){put(A[i],'del');i++}else{put(B[j],'ins');j++}}
  while(i<n)put(A[i++],'del');while(j<m)put(B[j++],'ins');
  return out.join(' ').replace(/ ?<br> ?/g,'<br>');
}
function sheetHtml(ids){
  const r=S.round;
  const body=ids.map(id=>{const s=S.subs.get(id);if(!s)return'';
    return `<section class="pg"><h1>논증문 피드백지 · ${r}차</h1><p class="who">${esc(s.label)}</p><p class="q"><b>과제</b> ${esc(cfg('question'))}</p><h2>내 글</h2><div class="box">${esc(txt(id,r))||'(글 없음)'}</div><h2>세 가지 피드백</h2>${SLOTS.map(sl=>`<div class="box ${sl}"><b>${esc(penName(sl))}</b>\n${esc(dft(id,r,sl))||'(아직 없음)'}</div>`).join('')}</section>`}).join('');
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>피드백지 ${r}차</title><style>body{font:15px/1.7 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111;margin:24px}.pg{max-width:760px;margin:0 auto 48px;page-break-after:always}h1{font-size:22px;margin:0}.who{font-size:18px;font-weight:700;margin:4px 0}.q{color:#444}h2{font-size:16px;margin:22px 0 8px}.box{border:1px solid #ccc;border-radius:8px;padding:12px 14px;margin:8px 0;white-space:pre-wrap}.box b{display:block;margin-bottom:2px}.ai b{color:#1f5bd1}.e1 b{color:#c3263a}.e2 b{color:#a35a00}@media print{body{margin:0}}</style></head><body>${body}</body></html>`;
}
function sheetText(ids){
  const r=S.round;
  return ids.map(id=>{const s=S.subs.get(id);if(!s)return'';
    return [`[논증문 피드백지 · ${r}차] ${s.label}`,`과제: ${cfg('question')}`,'',`내 글\n${txt(id,r)||'(글 없음)'}`,...SLOTS.map(sl=>`\n${penName(sl)}\n${dft(id,r,sl)||'(아직 없음)'}`)].join('\n')}).filter(Boolean).join('\n\n────────\n\n');
}
async function exportSheets(ids){
  await flush();ids=ids.filter(id=>S.subs.has(id));
  if(!ids.length){note('내보낼 학생이 없어요.');return}
  const r=S.round,one=ids.length===1?S.subs.get(ids[0]):null;
  const name=`피드백지_${r}차_${one?String(one.label).replace(/[\\/:*?"<>|\s]+/g,'_'):'전체'}.html`;
  if(dl){try{await dl.save({filename:name,data:sheetHtml(ids)});note('피드백지를 받았어요. 파일을 열어 인쇄하거나 PDF로 저장하세요.')}catch(e){note(e&&e.code==='declined'?'':'피드백지를 받지 못했어요.')}return}
  try{await navigator.clipboard.writeText(sheetText(ids));note('피드백지 내용을 복사했어요. 문서에 붙여 넣어 쓰세요.')}catch(e){note('이 화면에서는 내려받기와 복사를 할 수 없어요.')}
}
function onData(){
  if(S.sel&&!S.subs.has(S.sel))S.sel=null;
  if(!S.sel&&S.subs.size){S.sel=sorted()[0].id;remember()}
  renderList();
  if(built!==S.sel+'|'+S.round||(S.sel&&!$('#essayR')))buildWs();else fillWs();
}
async function select(id){if(id===S.sel)return;await flush();S.sel=id;remember();renderList();buildWs()}

document.addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('ov'))closeOv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
$('#okGo').addEventListener('click',()=>{const f=okFn;okFn=null;closeOv();if(f)f()});
$('#fSet').addEventListener('submit',async e=>{
  e.preventDefault();
  try{await db.doc('config/main').set({question:$('#sQ').value.trim(),criteria:$('#sC').value.trim(),context:$('#sX').value.trim(),e1Name:$('#sE1').value.trim(),e2Name:$('#sE2').value.trim()});closeOv()}
  catch(err){note('설정을 저장하지 못했어요.')}
});
window.addEventListener('pagehide',()=>{flush()});

async function init(){
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  let loaded=false;
  const lt=setTimeout(()=>{if(!loaded)note('아직 데이터를 불러오지 못했어요. 연결을 확인해 주세요.')},10000);
  const done=()=>{if(loaded)return;loaded=true;clearTimeout(lt);if($('#note').textContent.startsWith('아직'))note('')};
  [db,user,sample,dl]=await Promise.all(['db','user','sample','downloads'].map(use));
  if(!db||!user){clearTimeout(lt);$('#main').innerHTML='<div class="solo"><div class="empty"><b>저장소에 연결할 수 없어요</b>이 페이지는 claude.ai에 로그인한 상태에서 열 때 동작해요.</div></div>';return}
  try{S.me=await user.id();S.admin=!!(await user.canEdit());S.owner=!!(await user.isOwner())}catch(e){}
  const fail=e=>{done();note(e&&e.code==='revoked'?'접근 권한이 바뀌었어요.':'데이터를 불러오지 못했어요.')};
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};renderTop();if(S.admin)fillWs();else{stuBuilt=null;renderStudent()}},fail);
  if(S.admin){
    $('#acts').hidden=false;$('#setB').hidden=!S.owner;$('#bulk').hidden=!sample;
    if(!dl)$('#dlAll').textContent='피드백지 모두 복사';
    $('#main').className='wrap';
    $('#main').innerHTML='<aside class="roster"><div class="rh"><span>학생</span><span>AI · 전문가 1 · 2</span></div><ul id="list"></ul></aside><section class="ws" id="ws"><div class="empty"><b>불러오는 중</b>잠시만 기다려 주세요.</div></section>';
    $('#list').addEventListener('click',e=>{const b=e.target.closest('.stu');if(b)select(b.dataset.id)});
    $('#rounds').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||+b.dataset.r===S.round)return;await flush();S.round=+b.dataset.r;remember();renderTop();renderList();buildWs()});
    $('#bulk').addEventListener('click',bulk);
    $('#dlAll').addEventListener('click',()=>exportSheets(sorted().map(s=>s.id)));
    $('#setB').addEventListener('click',()=>{$('#sQ').value=cfg('question');$('#sC').value=cfg('criteria');$('#sX').value=cfg('context');$('#sE1').value=cfg('e1Name');$('#sE2').value=cfg('e2Name');openOv('ovSet')});
    db.collection('subs').onSnapshot(qs=>{if(!qs.metadata.fromCache)done();S.subs=new Map(qs.docs.map(d=>[d.id,d.data()]));onData()},fail);
    db.collection('drafts').onSnapshot(qs=>{S.drafts=new Map(qs.docs.map(d=>[d.id,d.data()]));onData()},fail);
    db.collection('sent').onSnapshot(qs=>{S.sent=new Map(qs.docs.map(d=>[d.id,d.data()]));onData()},fail);
  }else{
    if(!S.me){clearTimeout(lt);$('#main').innerHTML='<div class="solo"><div class="empty"><b>로그인이 필요해요</b>claude.ai에 로그인한 뒤 다시 열어 주세요.</div></div>';return}
    db.doc('subs/'+S.me).onSnapshot(s=>{if(!s.metadata.fromCache)done();S.mine=s.exists?s.data():null;renderStudent()},fail);
    db.doc('sent/'+S.me).onSnapshot(s=>{S.mySent=s.exists?s.data():null;renderStudent()},fail);
  }
}
renderTop();init();
}
</script>
