<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나노입자실험_글쓰기_피드백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for one teacher and two expert reviewers
   IDEA a marking desk: the student's ruled manuscript sheet with three coloured pens beside it
   PICTURE the open manuscript and three pen-coloured feedback cards, live from the shared store
   COLOUR white ground, near-black ink; blue, red, amber pens for AI / expert 1 / expert 2
   TYPE IBM Plex Sans KR for the desk, Noto Serif KR for the student's own writing
   LAYOUT roster column left, sheet over pens right; at 860px the roster becomes a chip row; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#14161b);--ink:light-dark(#16171b,#ecebe7);--mute:light-dark(#5f626a,#a2a5ad);--line:light-dark(#e4e2dd,#2d3038);--side:light-dark(#f5f4f1,#1a1d23);--rule:light-dark(#ebe5d8,#292c33);--ai:light-dark(#1f5bd1,#86acff);--e1:light-dark(#c3263a,#ff8593);--e2:light-dark(#a35a00,#f0aa52)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding:24px max(4vw,16px) 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.02em;font-weight:700}
.q{margin:6px 0 0;color:var(--mute);max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.ghost.danger{color:var(--e1)}
.btn.red{background:var(--e1);border-color:var(--e1);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,.stu:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:7px;background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.note{margin:0;padding:10px max(4vw,16px);background:var(--side);border-bottom:1px solid var(--line);font-size:14px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr)}
.roster{background:var(--side);border-right:1px solid var(--line);padding:16px 12px}
.rh{display:flex;justify-content:space-between;gap:8px;padding:0 8px 10px;font-size:13px;color:var(--mute)}
#list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.stu{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.stu:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.stu.on{background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:5px;flex:none}
.d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c,var(--mute))}
.d.f{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.ws{padding:22px max(3vw,16px) 48px}
.wsh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{margin:0;font-size:24px;letter-spacing:-.01em}
.wsa{display:flex;gap:8px;flex-wrap:wrap}
.sheet{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px}
.meta{font-size:13px;color:var(--mute)}
.essay{display:block;width:100%;min-height:18em;resize:vertical;border:0;padding:0 2px;background:transparent repeating-linear-gradient(to bottom,transparent 0 calc(2em - 1px),var(--rule) calc(2em - 1px) 2em);background-attachment:local;font:17px/2em "Noto Serif KR",Batang,serif}
.essay:focus{outline:none}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.diff{font:16px/1.9 "Noto Serif KR",serif}
.diff ins{background:color-mix(in srgb,var(--ai) 20%,transparent);text-decoration:none;border-radius:3px}
.diff del{color:var(--e1);opacity:.8}
.pens{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pen{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pen h3{margin:0;font-size:16px;color:var(--pen);display:flex;align-items:center;gap:8px}
.pen h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pen);flex:none}
.pen textarea{flex:1;min-height:17em;width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px;line-height:1.65}
.pen textarea:focus{border-color:var(--pen);outline:none}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.empty{max-width:46ch;padding:40px 0;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.dlg{background:var(--bg);border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.dlg h3{margin:0;font-size:20px}
.dlg label{display:grid;gap:6px;font-weight:600;font-size:14px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;font-weight:400}
.dlg textarea{min-height:6em;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.roster{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}#list{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}#list li{flex:none}.stu{width:auto}}
@media(max-width:600px){.top{align-items:flex-start}.acts{width:100%}.acts .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:no-preference){.pen textarea.busy{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{border-color:var(--pen)}}}
</style>
</head>
<body>
<header class="top">
  <div><h1>나노입자실험_글쓰기_피드백</h1><p class="q" id="q">과제를 불러오는 중이에요.</p></div>
  <div class="acts">
    <div class="seg" id="rounds" aria-label="차수"><button type="button" data-r="1" class="on">1차 글</button><button type="button" data-r="2">2차 수정본</button></div>
    <button type="button" class="btn ghost" id="bulk" hidden>AI 피드백 모두 만들기</button>
    <button type="button" class="btn ghost" id="dlAll">피드백지 모두 받기</button>
    <button type="button" class="btn ghost" id="setB" hidden>과제 설정</button>
    <button type="button" class="btn" id="addB" hidden>학생 추가</button>
  </div>
</header>
<p class="note" id="note" hidden></p>
<main class="wrap">
  <aside class="roster"><div class="rh"><span>학생</span><span>글 · AI · 전문가 1 · 2</span></div><ul id="list"></ul></aside>
  <section class="ws" id="ws"><div class="empty"><b>불러오는 중</b>잠시만 기다려 주세요.</div></section>
</main>
<div class="ov" id="ovAdd" hidden><form class="dlg" id="fAdd"><h3>학생 추가</h3><label for="addT">한 줄에 한 명씩, 실명 대신 번호나 가명으로 적어 주세요</label><textarea id="addT" placeholder="1번&#10;2번&#10;3번"></textarea><div class="row"><button class="btn" type="submit">추가</button><button class="btn ghost" type="button" data-close>취소</button></div></form></div>
<div class="ov" id="ovSet" hidden><form class="dlg" id="fSet"><h3>과제 설정</h3><label>과제 질문<textarea id="sQ"></textarea></label><label>평가 기준 (AI 피드백에 쓰여요)<textarea id="sC"></textarea></label><label>실험 자료 요약 (AI 피드백에 쓰여요)<textarea id="sX"></textarea></label><div class="two"><label>전문가 1 이름<input id="sE1"></label><label>전문가 2 이름<input id="sE2"></label></div><div class="row"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-close>취소</button></div></form></div>
<div class="ov" id="ovDel" hidden><div class="dlg"><h3 id="delT">학생을 지울까요?</h3><p class="meta">이 학생의 1차·2차 글과 모든 피드백이 함께 지워져요. 되돌릴 수 없어요.</p><div class="row"><button class="btn red" type="button" id="delOk">지우기</button><button class="btn ghost" type="button" data-close>취소</button></div></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLOTS=['ai','e1','e2'];
const DEF={
  question:'물질의 색은 물질의 특성인가? 실험 결과를 근거로 자신의 주장을 펼치는 글을 쓰시오.',
  criteria:'주장: 범위나 조건을 붙여 분명하게 썼는가\n근거의 다양성: 자료를 여러 개 쓰고, 같은 물질인데 색이 다른 경우와 다른 물질인데 색이 같은 경우를 모두 다루었는가\n추론: 각 결과가 주장을 어떻게 뒷받침하는지 연결했는가\n과학 개념: 흡수, 산란, 보색을 정확히 썼는가\n반론: 반론을 제시하고 증거로 재반박했는가',
  context:'1. 은거울 반응: 질산은과 암모니아수로 만든 용액에 포도당을 넣자 시험관 벽에 은색 거울이 생김\n2. 은 나노입자 합성: 질산은에 수소화붕소나트륨을 넣자 투명한 노란 용액이 됨 (시간이 지나 뭉치면 색이 변함)\n3. 틴들 현상: 나노입자 용액과 같은 색으로 만든 식용 색소 용액에 레이저를 비추자 나노입자 용액에서만 빛줄기가 보임\n4. 금 나노입자 합성과 UV 측정: 환원제 농도에 따라 붉은색에서 보라색까지 달라지고, 최대 흡수 파장이 약 520nm에서 더 긴 쪽으로 이동함\n5. 리쿠르고스 컵: 4세기 로마 유리잔. 앞에서 빛을 비추면 초록, 뒤에서 비추면 빨강으로 보임',
  e1Name:'전문가 1',e2Name:'전문가 2'
};
const S={cfg:{},students:[],essays:new Map(),fb:new Map(),sel:null,round:1,dirty:new Set(),busy:new Set(),me:null,admin:false,canW:true,names:{}};
let db=null,user=null,sample=null,dl=null,built=null,running=false,stop=false;
const timers={},pending={},chain={},asked=new Set();
try{const o=JSON.parse(localStorage.getItem('fbroom')||'{}');S.sel=o.sel||null;S.round=o.round===2?2:1}catch(e){}
const remember=()=>{try{localStorage.setItem('fbroom',JSON.stringify({sel:S.sel,round:S.round}))}catch(e){}};
const cfg=k=>typeof S.cfg[k]==='string'&&S.cfg[k].trim()?S.cfg[k]:DEF[k];
const eKey=(sid,r)=>sid+'_'+r;
const fKey=(sid,r,sl)=>sid+'_'+r+'_'+sl;
const essay=(sid,r)=>(S.essays.get(eKey(sid,r))||{}).text||'';
const fbt=(sid,r,sl)=>(S.fb.get(fKey(sid,r,sl))||{}).text||'';
const penName=sl=>sl==='ai'?'AI 피드백':cfg(sl+'Name');
const note=t=>{const n=$('#note');n.textContent=t||'';n.hidden=!t};
const sorted=()=>[...S.students].sort((a,b)=>(a.order||0)-(b.order||0)||String(a.label).localeCompare(String(b.label),'ko'));
const when=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const live=(sid,r)=>sid===S.sel&&r===S.round&&$('#essay');
const field=k=>k==='essay'?$('#essay'):$('#t-'+k);
const stat=(k,t)=>{const el=document.getElementById(k==='essay'?'em':'m-'+k);if(el)el.textContent=t};
const openOv=id=>{const o=$('#'+id);o.hidden=false;const f=o.querySelector('textarea,input,.btn');f&&f.focus()};
const closeOv=()=>document.querySelectorAll('.ov').forEach(o=>o.hidden=true);

function renderTop(){
  $('#q').textContent=cfg('question');
  document.querySelectorAll('#rounds button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.round));
  document.querySelectorAll('.pen[data-slot]').forEach(p=>{p.querySelector('h3 span').textContent=penName(p.dataset.slot)});
}
function renderList(){
  const L=sorted(),r=S.round;
  $('#list').innerHTML=L.length?L.map(s=>{
    const parts=[['',essay(s.id,r),'글'],['ai',fbt(s.id,r,'ai'),'AI'],['e1',fbt(s.id,r,'e1'),penName('e1')],['e2',fbt(s.id,r,'e2'),penName('e2')]];
    const dots=parts.map(([c,t])=>`<span class="d${t.trim()?' f':''}"${c?` style="--c:var(--${c})"`:''}></span>`).join('');
    const tip=parts.map(([,t,n])=>n+(t.trim()?' 있음':'없음')).join(', ');
    return `<li><button type="button" class="stu${s.id===S.sel?' on':''}" data-id="${esc(s.id)}" title="${esc(tip)}" aria-label="${esc(s.label+', '+tip)}"><span class="nm">${esc(s.label)}</span><span class="dots" aria-hidden="true">${dots}</span></button></li>`;
  }).join(''):'<li class="meta" style="padding:8px">아직 학생이 없어요.</li>';
}
function buildWs(){
  const ws=$('#ws'),st=S.students.find(s=>s.id===S.sel),r=S.round;
  built=S.sel+'|'+r;S.dirty.clear();
  if(!st){ws.innerHTML=S.students.length?'<div class="empty"><b>학생을 골라 주세요</b>목록에서 학생을 누르면 글과 피드백이 열려요.</div>':`<div class="empty"><b>학생을 추가해 주세요</b>${S.admin?'‘학생 추가’로 번호나 가명을 넣은 뒤, 학생 글을 붙여 넣으면 시작할 수 있어요.':'선생님이 학생을 추가하면 여기에 나타나요.'}</div>`;return}
  ws.innerHTML=`<div class="wsh"><h2>${esc(st.label)} <span class="meta">${r}차 ${r===1?'글':'수정본'}</span></h2><div class="wsa"><button type="button" class="btn ghost" id="dlOne">${dl?'이 학생 피드백지 받기':'이 학생 피드백지 복사'}</button>${S.admin?'<button type="button" class="btn ghost danger" id="delS">학생 삭제</button>':''}</div></div>
  <div class="sheet"><div class="bar"><b>학생 글</b><span class="meta" id="cc"></span><span class="meta" id="em"></span></div>
  <textarea class="essay" id="essay" aria-label="학생 글" placeholder="${S.admin?'학생이 쓴 글을 여기에 붙여 넣으세요. 입력을 멈추면 자동으로 저장돼요.':'아직 글이 없어요.'}"${S.admin?'':' readonly'}></textarea>
  ${r===2?'<details id="dbox" open><summary>1차 글과 달라진 부분</summary><div class="diff" id="diff"></div></details>':''}</div>
  <div class="pens">${SLOTS.map(sl=>`<article class="pen" data-slot="${sl}" style="--pen:var(--${sl})"><h3><span>${esc(penName(sl))}</span></h3>
  <textarea id="t-${sl}" aria-label="${esc(penName(sl))}"${sl==='ai'?' placeholder="‘AI로 만들기’를 누르면 초안이 생겨요. 읽어 보고 고쳐 써도 돼요."':''}${S.canW?'':' readonly'}></textarea>
  <div class="row">${sl==='ai'&&sample&&S.canW?'<button type="button" class="btn ghost" id="gen">AI로 만들기</button>':''}<span class="meta" id="m-${sl}"></span></div></article>`).join('')}</div>`;
  $('#essay').addEventListener('input',()=>{S.dirty.add('essay');count();queue('essay')});
  SLOTS.forEach(sl=>$('#t-'+sl).addEventListener('input',()=>{S.dirty.add(sl);queue(sl)}));
  const g=$('#gen');if(g)g.addEventListener('click',()=>genOne(S.sel,S.round));
  $('#dlOne').addEventListener('click',()=>exportSheets([S.sel]));
  const d=$('#delS');if(d)d.addEventListener('click',()=>{$('#delT').textContent=`‘${st.label}’ 학생을 지울까요?`;openOv('ovDel')});
  fillWs();
}
function count(){const t=$('#essay');if(t)$('#cc').textContent=t.value.replace(/\s/g,'').length+'자 (공백 제외)'}
function meta(k,d){
  if(S.dirty.has(k))return;
  if(!d||!d.updatedAt){stat(k,'');return}
  if(d.by&&!(d.by in S.names))loadNames([d.by]);
  const nm=d.by?S.names[d.by]:'';
  stat(k,[d.src==='ai'?'AI가 쓴 초안':'마지막 저장',nm,when(d.updatedAt)].filter(Boolean).join(' · '));
}
function fillWs(){
  if(!S.sel||!$('#essay'))return;
  const sid=S.sel,r=S.round,ta=$('#essay');
  if(!S.dirty.has('essay'))ta.value=essay(sid,r);
  count();meta('essay',S.essays.get(eKey(sid,r)));
  SLOTS.forEach(sl=>{if(S.busy.has(fKey(sid,r,sl)))return;if(!S.dirty.has(sl))$('#t-'+sl).value=fbt(sid,r,sl);meta(sl,S.fb.get(fKey(sid,r,sl)))});
  const g=$('#gen');if(g){g.textContent=fbt(sid,r,'ai').trim()?'AI로 다시 만들기':'AI로 만들기';g.disabled=!essay(sid,r).trim()||S.busy.has(fKey(sid,r,'ai'))}
  const df=$('#diff');if(df){const a=essay(sid,1),b=essay(sid,2);df.innerHTML=a.trim()&&b.trim()?diff(a,b):'<span class="meta">1차 글과 2차 글이 모두 있어야 비교할 수 있어요.</span>'}
}
async function loadNames(ids){
  if(!user)return;
  ids=ids.filter(i=>i&&!asked.has(i));if(!ids.length)return;
  ids.forEach(i=>asked.add(i));
  try{const ps=await user.profiles(ids);ids.forEach(i=>{S.names[i]=(ps&&ps[i]&&ps[i].name)||''})}catch(e){ids.forEach(i=>{S.names[i]=''})}
  fillWs();
}
function queue(k){
  const sid=S.sel,r=S.round,el=field(k);
  clearTimeout(timers[k]);stat(k,'입력 중…');
  pending[k]=()=>save(k,sid,r,el.value);
  timers[k]=setTimeout(()=>{const f=pending[k];delete pending[k];if(f)f()},1200);
}
function flush(){Object.keys(pending).forEach(k=>{clearTimeout(timers[k]);const f=pending[k];delete pending[k];f()})}
function save(k,sid,r,text){
  const path=k==='essay'?'essays/'+eKey(sid,r):'feedback/'+fKey(sid,r,k);
  const body=k==='essay'?{sid,round:r,text,updatedAt:Date.now(),by:S.me}:{sid,round:r,slot:k,text,updatedAt:Date.now(),by:S.me,src:k==='ai'?'edited':'human'};
  chain[path]=(chain[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>{
    if(!live(sid,r))return;
    const el=field(k);if(el&&el.value===text&&!pending[k])S.dirty.delete(k);
    stat(k,'저장됨');
  },e=>{if(live(sid,r))stat(k,e&&e.code==='invalid_argument'?'저장 권한이 없어요.':e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'저장하지 못했어요. 다시 입력해 보세요.')});
  return chain[path];
}
function buildPrompt(sid,r){
  const prev=r===2?essay(sid,1):'';
  const prevFb=r===2?SLOTS.map(sl=>fbt(sid,1,sl).trim()?`(${penName(sl)})\n${fbt(sid,1,sl)}`:'').filter(Boolean).join('\n\n'):'';
  return `너는 중학생의 과학 논증문을 읽고 피드백을 주는 과학 선생님이다.

[과제]
${cfg('question')}

[학생이 쓸 수 있는 실험 자료]
${cfg('context')}

[평가 기준]
${cfg('criteria')}

[과학 개념 점검 포인트]
- 은거울과 은 나노입자는 둘 다 질산은 속 은 이온이 은으로 바뀐 같은 물질이고, 차이는 크기다.
- UV에서 가장 많이 흡수한 빛의 보색이 눈에 보이는 색이다. 약 520nm(초록)를 흡수하면 빨갛게 보인다. 흡수한 색이 그대로 보인다고 쓰면 바로잡아 준다.
- 틴들 현상: 나노입자는 알갱이라서 빛을 산란시켜 빛줄기가 보이고, 색소는 분자로 녹아 있어 빛을 거의 산란시키지 않는다. 흡수와 산란을 섞어 쓰면 바로잡아 준다.
- 리쿠르고스 컵: 앞에서 비추면 나노입자가 산란시킨 초록빛이, 뒤에서 비추면 초록이 흡수되거나 흩어지고 남은 빨간빛이 보인다.
${r===2?`
[이 학생의 1차 글]
${prev||'(없음)'}

[1차 글에 받은 피드백]
${prevFb||'(없음)'}
`:''}
[${r===2?'수정한 2차 글':'학생 글'}]
${essay(sid,r)}

[쓰는 방법]
- 선생님이 글 아래에 적어 주는 일반적인 피드백처럼, 제목이나 목록 없이 이어지는 글 한두 문단으로 쓴다.
- 중학생이 읽기 쉽게 '~해요' 체로, 200~300자 안팎으로 짧게 쓴다.
- 좋은 점과 더 나아질 점을 자연스럽게 함께 담되, 고칠 점은 가장 중요한 한두 가지만 골라 어떻게 고치면 좋은지 알려 준다.${r===2?'\n- 1차 글보다 나아진 점을 먼저 짧게 말해 준다.':''}
- 과학 개념이 틀린 곳이 있으면 그것을 고칠 점으로 우선 알려 준다.
- 점수나 등급은 매기지 않는다. 학생 글을 대신 고쳐 써 주지 말고 방향만 알려 준다.
- 인사말이나 맺음말은 쓰지 않는다.`;
}
async function genOne(sid,r){
  const key=fKey(sid,r,'ai');
  if(!sample||S.busy.has(key)||!essay(sid,r).trim())return null;
  flush();S.busy.add(key);
  if(live(sid,r)){const t=$('#t-ai');t.classList.add('busy');t.value='';stat('ai','AI가 글을 읽는 중…');const g=$('#gen');if(g)g.disabled=true}
  let err=null;
  try{
    const res=await sample(buildPrompt(sid,r),{modelTier:'default',onText:({text})=>{if(live(sid,r))$('#t-ai').value=text}});
    const out=String(res&&res.text||'').trim();
    if(!out)throw {code:'empty'};
    await db.doc('feedback/'+key).set({sid,round:r,slot:'ai',text:out,updatedAt:Date.now(),by:S.me,src:'ai'});
  }catch(e){
    err=(e&&e.code)||'error';
    if(err==='not_granted'){sample=null;$('#bulk').hidden=true;const g=$('#gen');if(g)g.remove()}
    if(live(sid,r))stat('ai',err==='rate_limited'?'요청이 많아요. 잠시 뒤에 다시 눌러 주세요.':err==='not_granted'?'AI 사용이 허용되지 않았어요.':'AI 피드백을 만들지 못했어요.');
  }
  S.busy.delete(key);
  if(live(sid,r)){$('#t-ai').classList.remove('busy');S.dirty.delete('ai');const keep=err?$('#m-ai').textContent:'';fillWs();if(err)stat('ai',keep)}
  return err;
}
async function bulk(){
  if(running){stop=true;return}
  const r=S.round,todo=sorted().filter(s=>essay(s.id,r).trim()&&!fbt(s.id,r,'ai').trim());
  if(!todo.length){note(`${r}차 글이 있는 학생은 모두 AI 피드백을 받았어요.`);return}
  running=true;stop=false;const b=$('#bulk');b.textContent='멈추기';
  let done=0,msg='';
  for(const s of todo){
    if(stop){msg=`${done}명까지 만들고 멈췄어요.`;break}
    note(`AI 피드백 만드는 중: ${s.label} (${done+1}/${todo.length})`);
    const err=await genOne(s.id,r);
    if(err){msg=err==='rate_limited'?`요청이 많아 ${done}명까지 만들고 멈췄어요. 잠시 뒤 다시 눌러 주세요.`:`${s.label}에서 멈췄어요. AI 피드백을 만들지 못했어요.`;break}
    done++;
  }
  running=false;b.textContent='AI 피드백 모두 만들기';
  note(msg||`AI 피드백 ${done}개를 만들었어요. 학생에게 주기 전에 읽어 보고 필요하면 고쳐 주세요.`);
}
function diff(a,b){
  const tk=s=>s.replace(/\r/g,'').replace(/\n+/g,' \n ').split(/[ \t]+/).filter(Boolean).slice(0,1500);
  const A=tk(a),B=tk(b),n=A.length,m=B.length,W=m+1,L=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*W+j]=A[i]===B[j]?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  const out=[],put=(t,tag)=>out.push(t==='\n'?'<br>':tag?`<${tag}>${esc(t)}</${tag}>`:esc(t));
  let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){put(A[i]);i++;j++}else if(L[(i+1)*W+j]>=L[i*W+j+1]){put(A[i],'del');i++}else{put(B[j],'ins');j++}}
  while(i<n)put(A[i++],'del');while(j<m)put(B[j++],'ins');
  return out.join(' ').replace(/ ?<br> ?/g,'<br>');
}
function sheetHtml(ids){
  const r=S.round;
  const body=ids.map(id=>{const s=S.students.find(x=>x.id===id);if(!s)return'';
    return `<section class="pg"><h1>논증문 피드백지 · ${r}차</h1><p class="who">${esc(s.label)}</p><p class="q"><b>과제</b> ${esc(cfg('question'))}</p><h2>내 글</h2><div class="box">${esc(essay(id,r))||'(글 없음)'}</div><h2>세 가지 피드백</h2>${SLOTS.map(sl=>`<div class="box ${sl}"><b>${esc(penName(sl))}</b>\n${esc(fbt(id,r,sl))||'(아직 없음)'}</div>`).join('')}<h2>${r===1?'다시 쓰기 계획':'달라진 점 돌아보기'}</h2><p>${r===1?'세 피드백을 읽고, 내 글에서 고칠 점 세 가지를 적어 보세요.':'1차와 비교해 가장 나아진 점과 아직 아쉬운 점을 적어 보세요.'}</p><div class="lines"></div></section>`}).join('');
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>피드백지 ${r}차</title><style>body{font:15px/1.7 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111;margin:24px}.pg{max-width:760px;margin:0 auto 48px;page-break-after:always}h1{font-size:22px;margin:0}.who{font-size:18px;font-weight:700;margin:4px 0}.q{color:#444}h2{font-size:16px;margin:22px 0 8px}.box{border:1px solid #ccc;border-radius:8px;padding:12px 14px;margin:8px 0;white-space:pre-wrap}.box b{display:block;margin-bottom:2px}.ai b{color:#1f5bd1}.e1 b{color:#c3263a}.e2 b{color:#a35a00}.lines{height:9em;background:repeating-linear-gradient(to bottom,transparent 0 calc(1.8em - 1px),#bbb calc(1.8em - 1px) 1.8em)}@media print{body{margin:0}}</style></head><body>${body}</body></html>`;
}
function sheetText(ids){
  const r=S.round;
  return ids.map(id=>{const s=S.students.find(x=>x.id===id);if(!s)return'';
    return [`[논증문 피드백지 · ${r}차] ${s.label}`,`과제: ${cfg('question')}`,'',`내 글\n${essay(id,r)||'(글 없음)'}`,...SLOTS.map(sl=>`\n${penName(sl)}\n${fbt(id,r,sl)||'(아직 없음)'}`)].join('\n')}).filter(Boolean).join('\n\n────────\n\n');
}
async function exportSheets(ids){
  flush();ids=ids.filter(id=>S.students.some(s=>s.id===id));
  if(!ids.length){note('내보낼 학생이 없어요.');return}
  const r=S.round,one=ids.length===1?S.students.find(s=>s.id===ids[0]):null;
  const name=`피드백지_${r}차_${one?String(one.label).replace(/[\\/:*?"<>|\s]+/g,'_'):'전체'}.html`;
  if(dl){try{await dl.save({filename:name,data:sheetHtml(ids)});note('피드백지를 받았어요. 파일을 열어 인쇄하거나 PDF로 저장하세요.')}catch(e){note(e&&e.code==='declined'?'':'피드백지를 받지 못했어요.')}return}
  try{await navigator.clipboard.writeText(sheetText(ids));note('피드백지 내용을 복사했어요. 문서에 붙여 넣어 쓰세요.')}catch(e){note('이 화면에서는 내려받기와 복사를 할 수 없어요.')}
}
function onData(){
  if(S.sel&&!S.students.some(s=>s.id===S.sel))S.sel=null;
  if(!S.sel&&S.students.length){S.sel=sorted()[0].id;remember()}
  renderList();
  if(built!==S.sel+'|'+S.round||(S.sel&&!$('#essay')))buildWs();else fillWs();
}
function select(id){if(id===S.sel)return;flush();S.sel=id;remember();renderList();buildWs()}

$('#list').addEventListener('click',e=>{const b=e.target.closest('.stu');if(b)select(b.dataset.id)});
$('#rounds').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||+b.dataset.r===S.round)return;flush();S.round=+b.dataset.r;remember();renderTop();renderList();buildWs()});
$('#bulk').addEventListener('click',bulk);
$('#dlAll').addEventListener('click',()=>exportSheets(sorted().map(s=>s.id)));
$('#addB').addEventListener('click',()=>openOv('ovAdd'));
$('#setB').addEventListener('click',()=>{$('#sQ').value=cfg('question');$('#sC').value=cfg('criteria');$('#sX').value=cfg('context');$('#sE1').value=cfg('e1Name');$('#sE2').value=cfg('e2Name');openOv('ovSet')});
document.addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('ov'))closeOv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
$('#fAdd').addEventListener('submit',async e=>{
  e.preventDefault();
  const names=$('#addT').value.split('\n').map(s=>s.trim().slice(0,40)).filter(Boolean);
  if(!names.length)return;
  let o=Math.max(0,...S.students.map(s=>s.order||0));const base='s'+Date.now().toString(36);
  try{for(let i=0;i<names.length;i++)await db.doc('students/'+base+i).set({label:names[i],order:++o,createdAt:Date.now()});$('#addT').value='';closeOv();select(base+'0')}
  catch(err){note(err&&err.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'학생을 추가하지 못했어요.')}
});
$('#fSet').addEventListener('submit',async e=>{
  e.preventDefault();
  try{await db.doc('config/main').set({question:$('#sQ').value.trim(),criteria:$('#sC').value.trim(),context:$('#sX').value.trim(),e1Name:$('#sE1').value.trim(),e2Name:$('#sE2').value.trim()});closeOv()}
  catch(err){note('설정을 저장하지 못했어요.')}
});
$('#delOk').addEventListener('click',async()=>{
  const sid=S.sel;closeOv();if(!sid)return;
  const paths=['students/'+sid,...[1,2].flatMap(r=>['essays/'+eKey(sid,r),...SLOTS.map(sl=>'feedback/'+fKey(sid,r,sl))])];
  try{for(const p of paths)await db.doc(p).delete()}catch(err){note('지우지 못했어요.')}
});

async function init(){
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const lt=setTimeout(()=>note('아직 데이터를 불러오지 못했어요. 연결을 확인해 주세요.'),10000);
  [db,user,sample,dl]=await Promise.all(['db','user','sample','downloads'].map(use));
  if(!db){clearTimeout(lt);note('');$('#ws').innerHTML='<div class="empty"><b>저장소에 연결할 수 없어요</b>이 앱은 공유받은 사람이 claude.ai에 로그인한 상태에서 열 때 동작해요.</div>';return}
  if(user){try{S.me=await user.id();S.admin=!!(await user.canEdit());const c=await user.can('data.write');S.canW=c===null?true:!!c}catch(e){}}else S.admin=true;
  $('#addB').hidden=!S.admin;$('#setB').hidden=!S.admin;$('#bulk').hidden=!(sample&&S.canW);
  if(!dl)$('#dlAll').textContent='피드백지 모두 복사';
  if(!S.admin&&!S.canW)note('보기 권한만 있어요. 피드백을 쓰려면 선생님에게 편집 권한을 받아 주세요.');
  const fail=e=>note(e&&e.code==='revoked'?'접근 권한이 바뀌었어요.':'데이터를 불러오지 못했어요.');
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};renderTop()},fail);
  db.collection('students').onSnapshot(qs=>{if(!qs.metadata.fromCache){clearTimeout(lt);if($('#note').textContent.startsWith('아직'))note('')}S.students=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}));onData()},fail);
  db.collection('essays').onSnapshot(qs=>{S.essays=new Map(qs.docs.map(d=>[d.id,d.data()]));onData()},fail);
  db.collection('feedback').onSnapshot(qs=>{S.fb=new Map(qs.docs.map(d=>[d.id,d.data()]));onData()},fail);
}
renderTop();init();
}
